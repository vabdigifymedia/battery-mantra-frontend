name: Battery Mantra Frontend CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Deploy to VPS
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        password: ${{ secrets.VPS_PASSWORD }}
        timeout: 180s
        script_stop: true
        script: |
          cd /root/battery-mantra-frontend
          git fetch origin main
          git reset --hard origin/main
          npm install
          npm run build
          pm2 restart battery-frontend || pm2 start .output/server/index.mjs --name "battery-frontend"
          pm2 save
